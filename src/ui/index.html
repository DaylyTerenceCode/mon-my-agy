<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon-My-Agy · Context Usage</title>
  <!-- INLINE_STYLES -->
</head>
<body>
  <main class="pane-card" aria-label="Mon-My-Agy Context Usage Monitor">
    <header class="pane-header">
      <div class="header-identity">
        <span id="headerDot" class="status-dot" data-status="empty" aria-hidden="true"></span>
        <span class="brand-title">Mon-My-Agy</span>
        <span id="modelBadge" class="model-badge" title="waiting">waiting</span>
      </div>
      <div class="header-actions">
        <button
          id="compactBtn"
          class="icon-btn compact-btn hidden"
          type="button"
          aria-label="Compact"
          title="Compact"
          aria-expanded="false"
          aria-controls="confirmBar"
          data-status="empty"
          disabled
        >
          <span id="compactFill" class="compact-fill" style="width: 0%;"></span>
          <svg class="icon-svg compact-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 1.75v4.5M5.5 4.25L8 6.25l2.5-2" />
            <path d="M2.5 8h11" />
            <path d="M8 14.25v-4.5M5.5 11.75L8 9.75l2.5 2" />
          </svg>
        </button>
        <button
          id="refreshBtn"
          class="icon-btn"
          type="button"
          aria-label="Refresh"
          title="Refresh"
        >
          <svg class="icon-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.25 8a5.25 5.25 0 1 1-1.3-3.45" />
            <path d="M13.25 2.75v2.5h-2.5" />
          </svg>
        </button>
        <button
          id="colorToggleBtn"
          class="icon-btn"
          type="button"
          aria-label="Colors"
          title="Colors"
          aria-expanded="false"
          aria-controls="colorDrawer"
        >
          <svg class="icon-svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 1.75a6.25 6.25 0 0 0 0 12.5h.75a1.5 1.5 0 0 0 1.06-2.56 1.5 1.5 0 0 1 1.06-2.56h1.38A2 2 0 0 0 14.25 7.1 6.25 6.25 0 0 0 8 1.75Z" />
            <circle cx="5.25" cy="6.25" r="0.65" fill="currentColor" stroke="none" />
            <circle cx="8" cy="4.75" r="0.65" fill="currentColor" stroke="none" />
            <circle cx="10.75" cy="6.25" r="0.65" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>
    </header>

    <div id="confirmBar" class="confirm-bar hidden" role="region" aria-label="確認壓縮上下文">
      <span class="confirm-text">確認發送 <code class="confirm-code">/compact</code> 壓縮上下文？</span>
      <div class="confirm-actions">
        <button id="cancelCompactBtn" class="btn-secondary" type="button">取消</button>
        <button id="confirmCompactBtn" class="btn-primary" type="button">確認</button>
      </div>
    </div>

    <div id="colorDrawer" class="color-drawer hidden" role="region" aria-label="自定義配色">
      <div class="color-drawer-header">
        <span class="color-drawer-title">自定義配色</span>
        <div class="color-drawer-actions">
          <button id="resetColorsBtn" class="btn-secondary" type="button">重置</button>
          <button id="closeColorsBtn" class="btn-primary" type="button">完成</button>
        </div>
      </div>
      <div class="color-drawer-grid">
        <div class="color-group">
          <div class="color-group-title">上下文水位</div>
          <label class="color-row">
            <span class="color-label">健康水位</span>
            <span class="color-control">
              <code id="hex-success" class="color-hex tabular-nums"></code>
              <input id="pick-success" data-color-key="success" type="color" class="color-picker" aria-label="健康水位顏色" />
            </span>
          </label>
          <label class="color-row">
            <span class="color-label">預警水位</span>
            <span class="color-control">
              <code id="hex-warning" class="color-hex tabular-nums"></code>
              <input id="pick-warning" data-color-key="warning" type="color" class="color-picker" aria-label="預警水位顏色" />
            </span>
          </label>
          <label class="color-row">
            <span class="color-label">危險水位</span>
            <span class="color-control">
              <code id="hex-error" class="color-hex tabular-nums"></code>
              <input id="pick-error" data-color-key="error" type="color" class="color-picker" aria-label="危險水位顏色" />
            </span>
          </label>
        </div>
        <div class="color-group">
          <div class="color-group-title">Token 結構</div>
          <label class="color-row">
            <span class="color-label">Cache</span>
            <span class="color-control">
              <code id="hex-cacheRead" class="color-hex tabular-nums"></code>
              <input id="pick-cacheRead" data-color-key="cacheRead" type="color" class="color-picker" aria-label="Cache Read 顏色" />
            </span>
          </label>
          <label class="color-row">
            <span class="color-label">Input</span>
            <span class="color-control">
              <code id="hex-uncachedInput" class="color-hex tabular-nums"></code>
              <input id="pick-uncachedInput" data-color-key="uncachedInput" type="color" class="color-picker" aria-label="Uncached Input 顏色" />
            </span>
          </label>
          <label class="color-row">
            <span class="color-label">Output</span>
            <span class="color-control">
              <code id="hex-output" class="color-hex tabular-nums"></code>
              <input id="pick-output" data-color-key="output" type="color" class="color-picker" aria-label="Output 顏色" />
            </span>
          </label>
        </div>
      </div>
    </div>

    <div class="pane-body">
      <section id="modPrimary" class="mod-primary" aria-live="polite">
        <div class="empty-state">尚無已記錄的對話數據。完成一次對話回覆後將自動顯示 Context Usage。</div>
      </section>
      <section id="modBreakdown" class="mod-section hidden" aria-label="Token 結構分解"></section>
      <section id="modCumulative" class="mod-section mod-cumulative hidden" aria-label="會話累計消耗">
        <div class="section-header">
          <button
            id="toggleCumulativeBtn"
            class="cumulative-toggle"
            type="button"
            aria-expanded="true"
            aria-controls="cumulativeTotal cumulativeDetails"
          >
            <svg class="chevron-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6l4 4 4-4" />
            </svg>
            <span class="section-title">會話累計消耗</span>
          </button>
          <span id="cumulativeTotal" class="cumulative-total tabular-nums"></span>
        </div>
        <div id="cumulativeDetails" class="cumulative-breakdown tabular-nums"></div>
      </section>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </main>

  <!-- INLINE_SCRIPT -->
</body>
</html>
