<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon-My-Agy · UI Prototype v3</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .bar-transition { transition: width 0.3s ease, background-color 0.25s ease; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-4">
  <div class="max-w-lg mx-auto space-y-4">

    <!-- Prototype Controller -->
    <section class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-3 space-y-3">
      <div class="flex items-center justify-between gap-2 pb-2 border-b border-[var(--card-border)]">
        <span class="text-xs font-semibold tracking-wide uppercase text-[var(--primary)]">PROTOTYPE v3 · 極致密度評估</span>
        <span class="text-xs text-[var(--muted-foreground)]">/compact 進度填充按鈕</span>
      </div>

      <!-- Scenario States -->
      <div class="space-y-1.5">
        <div class="text-xs text-[var(--muted-foreground)]">1. 模擬上下文水位</div>
        <div class="grid grid-cols-5 gap-1.5">
          <button data-state="normal" class="state-btn px-1.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] transition">正常 21%</button>
          <button data-state="warning" class="state-btn px-1.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] transition">預警 78%</button>
          <button data-state="critical" class="state-btn px-1.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] transition">危險 93%</button>
          <button data-state="unknown" class="state-btn px-1.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] transition">未知模型</button>
          <button data-state="empty" class="state-btn px-1.5 py-1.5 rounded-lg text-xs font-medium border border-[var(--border)] transition">空狀態</button>
        </div>
      </div>

      <!-- Width & Optional Detail Toggle -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        <div class="space-y-1.5">
          <div class="text-xs text-[var(--muted-foreground)]">2. 模擬側邊欄寬度</div>
          <div class="grid grid-cols-2 gap-1.5">
            <button data-width="320" class="width-btn px-2 py-1 rounded-lg text-xs font-medium border border-[var(--border)] transition">窄版 320px</button>
            <button data-width="440" class="width-btn px-2 py-1 rounded-lg text-xs font-medium border border-[var(--border)] transition">標準 440px</button>
          </div>
        </div>
        <div class="space-y-1.5">
          <div class="text-xs text-[var(--muted-foreground)]">3. 細節開關</div>
          <label class="flex items-center gap-1.5 text-xs cursor-pointer select-none pt-1">
            <input id="toggleCumulative" type="checkbox" checked class="accent-[var(--primary)]" />
            <span>顯示會話累計消耗</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Simulated Auxiliary Side Pane -->
    <div id="paneWrapper" class="mx-auto transition-all duration-200" style="max-width: 440px;">
      <main class="bg-[var(--card)] border border-[var(--border)] rounded-xl overflow-hidden">

        <!-- Header: Progress-filled /compact container right next to Manual Refresh -->
        <header class="px-3.5 py-2.5 border-b border-[var(--card-border)] flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span id="headerDot" class="w-2.5 h-2.5 rounded-full shrink-0"></span>
            <span class="font-semibold text-sm shrink-0">Mon-My-Agy</span>
            <span id="modelBadge" class="text-xs px-1.5 py-0.5 rounded bg-[var(--secondary)] text-[var(--secondary-foreground)] font-mono truncate"></span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button id="compactBtn" title="發送 /compact 壓縮上下文"
              class="relative overflow-hidden px-2.5 py-1 rounded-md border border-[var(--border)] text-xs font-mono font-medium text-[var(--foreground)] transition cursor-pointer">
              <span id="compactFill" class="absolute inset-y-0 left-0 bar-transition pointer-events-none" style="width: 0%;"></span>
              <span class="relative z-10">/compact</span>
            </button>
            <button id="refreshBtn" title="手動刷新"
              class="px-2 py-1 rounded-md border border-[var(--border)] text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] hover:border-[var(--primary)] transition cursor-pointer">
              ↻
            </button>
          </div>
        </header>

        <!-- Two-step inline confirmation for /compact -->
        <div id="confirmBar" class="hidden px-3.5 py-2 border-b border-[var(--card-border)] bg-[var(--secondary)]/60 flex items-center justify-between gap-2 text-xs">
          <span>確認發送 <code class="font-mono text-[var(--code-foreground)]">/compact</code> 壓縮上下文？</span>
          <div class="flex items-center gap-1.5 shrink-0">
            <button id="cancelCompact" class="px-2 py-1 rounded-md border border-[var(--border)] text-xs cursor-pointer">取消</button>
            <button id="confirmCompact" class="px-2.5 py-1 rounded-md text-xs font-medium bg-[var(--primary)] text-[var(--primary-foreground)] cursor-pointer">確認</button>
          </div>
        </div>

        <!-- Conversation Switcher -->
        <div id="convBar" class="px-3.5 py-2 border-b border-[var(--card-border)] bg-[var(--background)]/40">
          <select id="convSelect" aria-label="切換對話" class="w-full bg-transparent text-xs text-[var(--foreground)] focus:outline-none truncate cursor-pointer">
            <option value="conv-1">Antigravity Context Usage Plugin Development</option>
            <option value="conv-2">Matt Pocock Skills Setup</option>
            <option value="conv-3">GitHub Skills Search And Analysis</option>
          </select>
        </div>

        <!-- Dense Telemetry Body -->
        <div class="p-3.5 space-y-3.5">
          <!-- Module 1: Primary Context Usage -->
          <section id="modPrimary"></section>

          <!-- Module 2: Token Breakdown -->
          <section id="modBreakdown" class="pt-3 border-t border-[var(--card-border)] space-y-2"></section>

          <!-- Module 3: Cumulative Usage -->
          <section id="modCumulative" class="pt-3 border-t border-[var(--card-border)] space-y-1.5"></section>
        </div>

      </main>
    </div>

    <!-- Toast Feedback -->
    <div id="toast" class="hidden text-xs px-3 py-2 rounded-lg bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)] text-center"></div>

  </div>

  <script>
    const SCENARIOS = {
      normal: {
        model: 'gemini-4-neon-medium',
        limit: 200000,
        uncachedInput: 10649,
        cacheRead: 31339,
        output: 627,
        cumulative: { uncachedInput: 52410, cacheRead: 98120, output: 4820 }
      },
      warning: {
        model: 'gemini-4-neon-medium',
        limit: 200000,
        uncachedInput: 24800,
        cacheRead: 128400,
        output: 2800,
        cumulative: { uncachedInput: 164200, cacheRead: 512000, output: 19400 }
      },
      critical: {
        model: 'gemini-4-neon-medium',
        limit: 200000,
        uncachedInput: 18500,
        cacheRead: 164200,
        output: 3300,
        cumulative: { uncachedInput: 215000, cacheRead: 842000, output: 28600 }
      },
      unknown: {
        model: 'gemini-next-exp-05',
        limit: null,
        uncachedInput: 14200,
        cacheRead: 48600,
        output: 1120,
        cumulative: { uncachedInput: 68400, cacheRead: 145000, output: 7210 }
      },
      empty: null
    };

    const ui = {
      scenario: 'normal',
      width: 440,
      showCumulative: true,
      confirmingCompact: false
    };

    const fmt = (n) => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
    const fmtFull = (n) => n.toLocaleString('en-US');

    function getStatusColor(pct) {
      if (pct === null) return 'var(--primary)';
      if (pct >= 85) return 'var(--error)';
      if (pct >= 70) return 'var(--warning)';
      return 'var(--success)';
    }

    function getStatusLabel(pct) {
      if (pct === null) return '上限未知';
      if (pct >= 85) return '危險水位';
      if (pct >= 70) return '預警水位';
      return '健康水位';
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 2200);
    }

    function render() {
      // Update controller buttons
      document.querySelectorAll('.state-btn').forEach(btn => {
        const active = btn.dataset.state === ui.scenario;
        btn.style.background = active ? 'var(--primary)' : 'transparent';
        btn.style.color = active ? 'var(--primary-foreground)' : 'var(--foreground)';
        btn.style.borderColor = active ? 'var(--primary)' : 'var(--border)';
      });
      document.querySelectorAll('.width-btn').forEach(btn => {
        const active = Number(btn.dataset.width) === ui.width;
        btn.style.background = active ? 'var(--primary)' : 'transparent';
        btn.style.color = active ? 'var(--primary-foreground)' : 'var(--foreground)';
        btn.style.borderColor = active ? 'var(--primary)' : 'var(--border)';
      });

      document.getElementById('paneWrapper').style.maxWidth = ui.width + 'px';
      document.getElementById('confirmBar').classList.toggle('hidden', !ui.confirmingCompact);

      const d = SCENARIOS[ui.scenario];
      const dotEl = document.getElementById('headerDot');
      const modelEl = document.getElementById('modelBadge');
      const compactBtn = document.getElementById('compactBtn');
      const compactFill = document.getElementById('compactFill');
      const convBar = document.getElementById('convBar');
      const primaryEl = document.getElementById('modPrimary');
      const breakdownEl = document.getElementById('modBreakdown');
      const cumulativeEl = document.getElementById('modCumulative');

      if (!d) {
        dotEl.style.background = 'var(--muted-foreground)';
        modelEl.textContent = 'waiting';
        compactFill.style.width = '0%';
        compactBtn.style.borderColor = 'var(--border)';
        convBar.classList.add('hidden');
        primaryEl.innerHTML = `<div class="text-xs text-[var(--muted-foreground)] py-2">尚無已記錄的對話數據。完成一次對話回覆後將自動顯示 Context Usage。</div>`;
        breakdownEl.classList.add('hidden');
        cumulativeEl.classList.add('hidden');
        return;
      }

      convBar.classList.remove('hidden');
      breakdownEl.classList.remove('hidden');

      const usage = d.uncachedInput + d.cacheRead + d.output;
      const pct = d.limit ? (usage / d.limit) * 100 : null;
      const remaining = d.limit ? Math.max(0, d.limit - usage) : null;
      const color = getStatusColor(pct);
      const barW = pct !== null ? Math.min(100, pct) : 100;

      dotEl.style.background = color;
      modelEl.textContent = d.model;

      // Liquid-fill /compact button tracks Context Usage percentage & status color
      if (pct !== null) {
        compactFill.style.width = `${Math.min(100, Math.max(0, pct))}%`;
        compactFill.style.background = `color-mix(in srgb, ${color} 32%, transparent)`;
        compactBtn.style.borderColor = `color-mix(in srgb, ${color} 60%, var(--border))`;
      } else {
        compactFill.style.width = '0%';
        compactBtn.style.borderColor = 'var(--border)';
      }

      // Primary Dense Telemetry
      primaryEl.innerHTML = `
        <div class="font-mono space-y-2">
          <div class="flex items-center justify-between gap-2 text-xs">
            <span class="text-[var(--muted-foreground)]">CTX_WINDOW</span>
            <span class="tabular-nums font-semibold" style="color:${color}">
              ${fmtFull(usage)}${d.limit ? ' / ' + fmtFull(d.limit) + ' (' + pct.toFixed(1) + '%)' : ' TOKENS (LIMIT_UNKNOWN)'}
            </span>
          </div>
          <div class="w-full h-2 rounded bg-[var(--secondary)] overflow-hidden">
            <div class="h-full bar-transition" style="width:${barW}%; background:${color}; ${pct === null ? 'opacity:0.45' : ''}"></div>
          </div>
          <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] tabular-nums">
            <span>STATUS: <strong style="color:${color}">${getStatusLabel(pct)}</strong></span>
            <span>${remaining !== null ? 'FREE: ' + fmtFull(remaining) : 'CFG: config.json'}</span>
          </div>
        </div>
      `;

      // Token Breakdown
      const totalIn = d.uncachedInput + d.cacheRead;
      const cacheHit = totalIn > 0 ? ((d.cacheRead / totalIn) * 100).toFixed(1) : '0.0';
      const wCache = (d.cacheRead / usage) * 100;
      const wUncached = (d.uncachedInput / usage) * 100;
      const wOutput = (d.output / usage) * 100;

      breakdownEl.innerHTML = `
        <div class="flex items-center justify-between text-xs">
          <span class="font-medium">Token 結構分解</span>
          <span class="text-[var(--muted-foreground)] tabular-nums">緩存命中率 <strong class="text-[var(--foreground)]">${cacheHit}%</strong></span>
        </div>
        <div class="w-full h-2 rounded bg-[var(--secondary)] overflow-hidden flex">
          <div style="width:${wCache}%; background: var(--chart-1);" class="bar-transition" title="Cache Read"></div>
          <div style="width:${wUncached}%; background: var(--chart-2);" class="bar-transition" title="Uncached Input"></div>
          <div style="width:${wOutput}%; background: var(--chart-3);" class="bar-transition" title="Output"></div>
        </div>
        <div class="space-y-1 font-mono text-xs tabular-nums">
          <div class="flex justify-between"><span class="flex items-center gap-1.5 text-[var(--muted-foreground)]"><i class="w-2 h-2 rounded-full inline-block" style="background:var(--chart-1)"></i>Cache Read</span><span>${fmtFull(d.cacheRead)}</span></div>
          <div class="flex justify-between"><span class="flex items-center gap-1.5 text-[var(--muted-foreground)]"><i class="w-2 h-2 rounded-full inline-block" style="background:var(--chart-2)"></i>Uncached Input</span><span>${fmtFull(d.uncachedInput)}</span></div>
          <div class="flex justify-between"><span class="flex items-center gap-1.5 text-[var(--muted-foreground)]"><i class="w-2 h-2 rounded-full inline-block" style="background:var(--chart-3)"></i>Output</span><span>${fmtFull(d.output)}</span></div>
        </div>
      `;

      // Cumulative Usage
      cumulativeEl.classList.toggle('hidden', !ui.showCumulative);
      if (ui.showCumulative) {
        const total = d.cumulative.uncachedInput + d.cumulative.cacheRead + d.cumulative.output;
        cumulativeEl.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <span class="font-medium">會話累計消耗</span>
            <span class="font-semibold font-mono tabular-nums">${fmt(total)} tokens</span>
          </div>
          <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] font-mono tabular-nums">
            <span>輸入 ${fmt(d.cumulative.uncachedInput)}</span>
            <span>緩存 ${fmt(d.cumulative.cacheRead)}</span>
            <span>輸出 ${fmt(d.cumulative.output)}</span>
          </div>
        `;
      }
    }

    document.querySelectorAll('.state-btn').forEach(btn => {
      btn.onclick = () => { ui.scenario = btn.dataset.state; ui.confirmingCompact = false; render(); };
    });
    document.querySelectorAll('.width-btn').forEach(btn => {
      btn.onclick = () => { ui.width = Number(btn.dataset.width); render(); };
    });
    document.getElementById('toggleCumulative').onchange = (e) => { ui.showCumulative = e.target.checked; render(); };
    document.getElementById('compactBtn').onclick = () => { ui.confirmingCompact = !ui.confirmingCompact; render(); };
    document.getElementById('cancelCompact').onclick = () => { ui.confirmingCompact = false; render(); };
    document.getElementById('confirmCompact').onclick = () => {
      ui.confirmingCompact = false;
      showToast('模擬調用 app.sendMessage("/compact") 成功');
      render();
    };
    document.getElementById('refreshBtn').onclick = () => showToast('已刷新最新上下文快照');

    render();
  </script>
</body>
</html>
